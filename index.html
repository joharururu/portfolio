<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="조하루의 BX 디자인 포트폴리오. WISELY, RE:CORD와 브랜드 경험 작업.">
  <title>조하루 — BX Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="content.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <header class="header">
    <a href="#/" class="identity">조하루</a>
    <nav aria-label="주 내비게이션">
      <button id="projects-toggle" aria-expanded="false" aria-controls="projects-menu">Projects</button>
      <a href="#/about">About</a>
    </nav>
    <div id="projects-menu" hidden aria-label="프로젝트 목록"></div>
  </header>
  <main id="main" tabindex="-1"></main>
  <dialog id="viewer" aria-label="프로젝트 이미지 뷰어">
    <div class="overlay-header"><span id="viewer-project"></span><button id="grid-toggle">Grid</button><button id="viewer-close">Close <span aria-hidden="true">×</span></button></div>
    <div id="viewer-content"></div>
    <div class="viewer-project-action"><a id="view-project" class="project-link">View Project <span aria-hidden="true">↗</span></a></div>
    <footer class="viewer-footer"><span id="viewer-caption" aria-live="polite"></span></footer>
  </dialog>
  <noscript>프로젝트 갤러리를 이용하려면 JavaScript를 켜 주세요.</noscript>
</body>
</html>
